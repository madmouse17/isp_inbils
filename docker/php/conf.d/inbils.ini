; PHP settings of the production image. The Dockerfile copies this file into /usr/local/etc/php/conf.d/, the directory
; PHP scans for extra ini files (the base image ships no php.ini, so every other setting stays at the PHP default).

; Stack traces keep no call arguments. failed_jobs.exception and the log files are made of stack traces, and the
; arguments of a WhatsApp send are a customer's phone number and the parameters of the message. PHP's default is to
; record every argument of every frame (and strings up to 15 characters in full, which is a whole phone number).
; Code that handles such values also marks the parameters #[\SensitiveParameter]; this setting covers the rest.
zend.exception_ignore_args = On
